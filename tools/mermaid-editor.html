<!-- The ZenUML plugin's dist file does `import ... from '@zenuml/core'` — a bare package
     specifier that only resolves in a bundler. This import map tells the browser where to
     actually fetch it from (jsDelivr's +esm endpoint resolves the package's own nested deps
     too), which is what a plain <script>/dynamic import() setup is otherwise missing. -->
<script type="importmap">
{
  "imports": {
    "@zenuml/core": "https://cdn.jsdelivr.net/npm/@zenuml/core@3/+esm"
  }
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  // jsDelivr already mirrors the current Mermaid release (needed for treeView/cynefin/venn/
  // ishikawa/wardley/zenuml/eventmodeling); cdnjs' index lags behind, so it's kept only as a
  // safety net at an older, still-broadly-capable version, with 10.9.1 as the last resort.
  // A 404 anywhere in this chain should never blank the whole page.
  window.MERMAID_LOAD = new Promise((resolve)=>{
    const sources = [
      { cdn:'jsdelivr', v:'11.16.1' },
      { cdn:'cdnjs',    v:'11.13.0' },
      { cdn:'jsdelivr', v:'11.13.0' },
      { cdn:'cdnjs',    v:'10.9.1'  }
    ];
    let i = 0;
    function urlFor(src){
      return src.cdn === 'jsdelivr'
        ? `https://cdn.jsdelivr.net/npm/mermaid@${src.v}/dist/mermaid.min.js`
        : `https://cdnjs.cloudflare.com/ajax/libs/mermaid/${src.v}/mermaid.min.js`;
    }
    function tryNext(){
      if(i >= sources.length){ resolve(null); return; }
      const src = sources[i++];
      const s = document.createElement('script');
      s.src = urlFor(src);
      s.onload = ()=>{ window.MERMAID_VERSION = src.v; window.MERMAID_SOURCE = src.cdn; resolve(src.v); };
      s.onerror = tryNext;
      document.head.appendChild(s);
    }
    tryNext();
  });
</script>
<style>
  :root{
    --bg:#0b0b0c;
    --panel:#131315;
    --panel-2:#0f0f11;
    --border:#28282c;
    --border-soft:#1e1e21;
    --text:#ececec;
    --muted:#a9a9ae;
    --muted-2:#5f5f64;
    --accent:#ffffff;
    --error:#ff6b5e;
    --control-bg:#1c1c1f;
    --control-bg-hover:#242428;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  [data-theme="light"]{
    --bg:#f5f5f4;
    --panel:#ffffff;
    --panel-2:#fafafa;
    --border:#e0e0de;
    --border-soft:#ececea;
    --text:#161616;
    --muted:#6b6b6d;
    --muted-2:#a0a0a2;
    --accent:#000000;
    --error:#c7412f;
    --control-bg:#f1f1ef;
    --control-bg-hover:#e6e6e3;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
    transition:background .2s ease, color .2s ease;
  }

  /* ---------- top bar ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; height:56px; flex-shrink:0;
    border-bottom:1px solid var(--border);
    background:var(--panel);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:22px; height:22px; border:1.5px solid var(--text); border-radius:3px;
    position:relative; flex-shrink:0;
  }
  .brand .mark::before, .brand .mark::after{
    content:""; position:absolute; background:var(--text);
  }
  .brand .mark::before{ width:9px; height:1.5px; top:6.5px; left:5.5px; }
  .brand .mark::after{ width:9px; height:1.5px; bottom:6.5px; left:5.5px; }
  .brand .wordmark{
    font-size:15px; font-weight:700; letter-spacing:-.01em; margin:0; color:var(--text);
    text-transform:lowercase;
  }
  .brand .wordmark .dim{ color:var(--muted); font-weight:500; }
  .brand .sub{
    font-size:10px; color:var(--muted); font-family:var(--mono);
    text-transform:uppercase; letter-spacing:.12em; padding-left:10px;
    border-left:1px solid var(--border);
  }

  .header-nav{ display:flex; align-items:center; gap:2px; }
  .navlink{
    font-family:var(--sans); cursor:pointer; border:none; background:transparent;
    color:var(--muted); font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.08em;
    padding:8px 12px; display:flex; align-items:center; gap:6px; border-radius:0;
    border-bottom:1.5px solid transparent; transition:color .12s ease, border-color .12s ease;
  }
  .navlink:hover{ color:var(--text); border-bottom-color:var(--text); }
  .navlink.filled{
    color:var(--bg); background:var(--text); border-radius:5px; border-bottom:none; margin-left:6px;
  }
  .navlink.filled:hover{ opacity:.85; color:var(--bg); border-bottom:none; }

  /* ---------- control toolbar strip ---------- */
  .toolbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px 20px; flex-shrink:0; border-bottom:1px solid var(--border);
    background:var(--panel-2);
  }

  .top-actions{ display:flex; align-items:center; gap:8px; }

  button{
    font-family:var(--sans); cursor:pointer; border-radius:6px;
    border:1px solid var(--border); background:var(--control-bg); color:var(--text);
    font-size:12.5px; padding:7px 12px; display:flex; align-items:center; gap:6px;
    transition:background .12s ease, border-color .12s ease, opacity .12s ease;
  }
  button:hover{ border-color:var(--muted); background:var(--control-bg-hover); }
  button:active{ transform:translateY(1px); }
  button.primary{
    background:var(--text); color:var(--bg); border-color:var(--text); font-weight:600;
  }
  button.primary:hover{ opacity:.85; background:var(--text); }
  button.icon{ padding:7px 8px; }
  button:disabled{ opacity:.35; cursor:not-allowed; }

  .divider-v{ width:1px; height:22px; background:var(--border); margin:0 2px; }

  /* ---------- main split ---------- */
  main{ flex:1; display:flex; min-height:0; position:relative; }

  .pane{ display:flex; flex-direction:column; min-width:0; }
  .pane-head{
    display:flex; align-items:center; justify-content:space-between;
    height:36px; padding:0 14px; flex-shrink:0;
    border-bottom:1px solid var(--border-soft);
    font-family:var(--mono); font-size:11px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.08em;
    background:var(--panel-2);
  }
  .pane-head .dot{
    width:6px; height:6px; border-radius:50%; background:var(--muted-2); margin-right:8px;
  }
  .pane-head-left{ display:flex; align-items:center; }

  #editor-pane{ background:var(--panel-2); }
  #code{
    flex:1; resize:none; border:none; outline:none;
    background:transparent; color:var(--text);
    font-family:var(--mono); font-size:13px; line-height:1.65;
    padding:16px 18px; tab-size:2;
  }
  #code::placeholder{ color:var(--muted-2); }

  /* draggable divider */
  #drag{
    width:9px; flex-shrink:0; cursor:col-resize; position:relative;
    background:var(--panel-2);
    border-left:1px solid var(--border-soft); border-right:1px solid var(--border-soft);
  }
  #drag::after{
    content:""; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(45deg);
    width:7px; height:7px; border:1px solid var(--muted); background:var(--panel);
  }
  #drag:hover::after{ border-color:var(--text); }

  #preview-pane{ background:var(--bg); }
  #canvas-wrap{
    flex:1; position:relative; overflow:hidden;
    background-image: radial-gradient(var(--border-soft) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  #stage{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    cursor:grab;
  }
  #stage.grabbing{ cursor:grabbing; }
  #diagram-holder{
    transform-origin:center center; transition:transform .06s linear;
    background:#ffffff; border-radius:10px; padding:22px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  #diagram-holder.theme-dark{ background:#15161a; }
  #diagram-holder.theme-empty{ background:transparent; box-shadow:none; padding:0; }
  #diagram-holder svg{ max-width:none !important; height:auto !important; display:block; }

  .empty-hint{
    color:var(--muted-2); font-family:var(--mono); font-size:12px; text-align:center; line-height:1.8;
  }

  .err-box{
    position:absolute; left:14px; right:14px; bottom:14px;
    background:var(--panel); border:1px solid var(--error); border-radius:8px;
    padding:12px 14px; font-family:var(--mono); font-size:12px; color:var(--error);
    display:none; max-height:120px; overflow:auto; white-space:pre-wrap;
  }
  .err-box.show{ display:block; }

  /* zoom controls */
  .zoom-ctrl{
    position:absolute; right:14px; top:14px; display:flex; gap:4px;
    background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:4px;
  }
  .zoom-ctrl button{ border:none; padding:6px 9px; }
  .zoom-ctrl button:hover{ background:var(--border-soft); }
  .zoom-pct{ font-family:var(--mono); font-size:11px; color:var(--muted); padding:6px 4px; min-width:40px; text-align:center; }

  /* ---------- bottom status ---------- */
  footer{
    height:30px; flex-shrink:0; border-top:1px solid var(--border);
    background:var(--panel); display:flex; align-items:center; justify-content:space-between;
    padding:0 14px; font-family:var(--mono); font-size:11px; color:var(--muted-2);
  }
  #status{ display:flex; align-items:center; gap:6px; }
  #status .led{ width:6px; height:6px; border-radius:50%; background:#4caf6d; }
  #status .led.error{ background:var(--error); }

  /* toast */
  #toast{
    position:fixed; bottom:44px; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--text); color:var(--bg); font-size:12.5px; font-weight:600;
    padding:9px 16px; border-radius:7px; opacity:0; pointer-events:none;
    transition:opacity .18s ease, transform .18s ease; z-index:50;
    font-family:var(--sans);
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* export menu */
  .menu-wrap{ position:relative; }
  .menu{
    position:absolute; top:calc(100% + 6px); right:0; background:var(--panel);
    border:1px solid var(--border); border-radius:8px; min-width:190px;
    box-shadow:0 12px 28px rgba(0,0,0,.35); padding:5px; display:none; z-index:40;
  }
  .menu.open{ display:block; }
  .menu-section{ font-family:var(--mono); font-size:10px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.08em; padding:7px 8px 3px; }
  .menu button{
    width:100%; justify-content:flex-start; border:none; padding:8px 8px; border-radius:5px; font-size:13px;
  }
  .menu button:hover{ background:var(--border-soft); }
  .menu hr{ border:none; border-top:1px solid var(--border-soft); margin:4px 2px; }

  @media (max-width: 760px){
    main{ flex-direction:column; }
    #drag{ display:none; }
    .pane{ height:50%; width:100% !important; }
    header{ padding:0 10px; }
    .brand .sub{ display:none; }
    .toolbar{ padding:8px 10px; }
  }
</style>
</head>

// architecture-beta's underlying cytoscape renderer logs a harmless style-mapping warning for
// every edge that has no label — it's cosmetic noise from mermaid's own internals, not something
// wrong with the diagram, and it never prevents the diagram from rendering. Filter just that one.
const _origWarn = console.warn.bind(console);
console.warn = (...args)=>{
  const msg = args.map(a => typeof a === 'string' ? a : '').join(' ');
  if(msg.includes('Do not assign mappings to elements without corresponding data')) return;
  _origWarn(...args);
};

// architecture-beta service icons (e.g. logos:aws-lambda, mdi:database) come from Iconify —
// Mermaid ships none of these by default, so an unregistered icon just silently drops that
// service's box instead of erroring. Register the icon sets architecture diagrams commonly use,
// lazy-loaded from jsDelivr's iconify mirror so nothing is fetched unless actually referenced.
if(typeof mermaid.registerIconPacks === 'function'){
  const iconPack = (name)=>({
    name,
    loader: () => fetch(`https://cdn.jsdelivr.net/npm/@iconify-json/${name}@1/icons.json`).then(r => r.json())
  });
  mermaid.registerIconPacks([
    iconPack('logos'),         // brand/vendor logos — aws-*, nextjs, docker, kubernetes, etc.
    iconPack('mdi'),           // Material Design Icons — common generic shapes (database, server, cloud…)
    iconPack('simple-icons'),  // simple brand marks
    iconPack('devicon')        // dev-tool/language icons
  ]);
}

// ZenUML is NOT part of core Mermaid — every other diagram type here is built into the
// mermaid.min.js we already loaded, but zenuml ships as a separate plugin package
// (@mermaid-js/mermaid-zenuml) that must be dynamically imported as an ES module and
// registered before mermaid recognizes the "zenuml" keyword at all. Without this step
// zenuml always fails with "unknown diagram type", regardless of the core Mermaid version.
if(typeof mermaid.registerExternalDiagrams === 'function'){
  const zenumlBuilds = [
    'https://cdn.jsdelivr.net/npm/@mermaid-js/mermaid-zenuml@0.2.3/dist/mermaid-zenuml.core.mjs',
    'https://cdn.jsdelivr.net/npm/@mermaid-js/mermaid-zenuml@0.2.2/dist/mermaid-zenuml.core.mjs',
    'https://cdn.jsdelivr.net/npm/@mermaid-js/mermaid-zenuml@0.2.0/dist/mermaid-zenuml.core.mjs',
    'https://cdn.jsdelivr.net/npm/@mermaid-js/mermaid-zenuml@0.1.0/dist/mermaid-zenuml.esm.min.mjs'
  ];
  window.ZENUML_LOAD = (async ()=>{
    for(const url of zenumlBuilds){
      try{
        const mod = await import(/* webpackIgnore: true */ url);
        await mermaid.registerExternalDiagrams([mod.default]);
        return true;
      }catch(e){ /* try the next build */ }
    }
    return false;
  })();
} else {
  window.ZENUML_LOAD = Promise.resolve(false);
}

const NODE_PALETTE = [

function addCopyrightMark(svgEl){
  try{
    const vb = svgEl.viewBox && svgEl.viewBox.baseVal;
    let x0 = vb ? vb.x : 0, y0 = vb ? vb.y : 0;
    let w = (vb && vb.width) || parseFloat(svgEl.getAttribute('width')) || svgEl.clientWidth || 800;
    let h = (vb && vb.height) || parseFloat(svgEl.getAttribute('height')) || svgEl.clientHeight || 600;
    if(!w || !h) return;

    const fontSize = Math.max(11, Math.min(15, w * 0.016));
    const strip = Math.round(fontSize * 2.4);
    const bg = THEME_BG[diagramTheme] || '#ffffff';

    // grow the canvas downward by a dedicated strip so the mark never sits on top of diagram content
    const newH = h + strip;
    svgEl.setAttribute('viewBox', `${x0} ${y0} ${w} ${newH}`);
    const wAttr = parseFloat(svgEl.getAttribute('width'));
    const hAttr = parseFloat(svgEl.getAttribute('height'));
    if(wAttr && hAttr){
      svgEl.setAttribute('height', (hAttr * (newH / h)).toFixed(2));
    } else {
      svgEl.setAttribute('width', w);
      svgEl.setAttribute('height', newH);
    }

    const stripRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    stripRect.setAttribute('x', x0);
    stripRect.setAttribute('y', y0 + h);
    stripRect.setAttribute('width', w);
    stripRect.setAttribute('height', strip);
    stripRect.setAttribute('fill', bg);
    svgEl.appendChild(stripRect);

    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('x', x0 + w - fontSize * 0.9);
    text.setAttribute('y', y0 + h + strip / 2 + fontSize * 0.34);
    text.setAttribute('text-anchor','end');
    text.setAttribute('font-family','ui-monospace, monospace');
    text.setAttribute('font-size', fontSize);
    text.setAttribute('fill', diagramTheme === 'dark' ? '#c9c9cc' : '#8a8a8a');
    text.setAttribute('fill-opacity', '0.8');
    text.textContent = '\u00A9 awjunaid.com';
    svgEl.appendChild(text);
  }catch(e){ /* if a diagram type has no measurable bbox, just skip the mark rather than break the render */ }
}

function wrapPlainSvgText(svgEl){
  // venn/ishikawa shapes are far smaller than a flowchart box, so the user's general wrap
  // setting is usually still too wide for them and text spills past the shape's edge —
  // clamp harder specifically for those, detected via mermaid's own aria-roledescription.
  const role = (svgEl.getAttribute('aria-roledescription') || '').toLowerCase();
  let maxChars = wrapChars;
  if(role.includes('venn')) maxChars = Math.min(wrapChars, 12);
  else if(role.includes('ishikawa')) maxChars = Math.min(wrapChars, 20);

  svgEl.querySelectorAll('text').forEach(textEl=>{
    if(textEl.querySelector('tspan')) return; // already multi-line (mermaid's own wrap, or a deliberate multi-row label) — leave it alone
    const content = (textEl.textContent || '').trim();
    if(!content || content.length <= maxChars) return;
    const words = content.split(/\s+/);
    if(words.length < 2) return; // a single long token (an id, a number) can't be word-wrapped usefully
    const lines = [];
    let cur = '';
    words.forEach(w=>{
      const test = cur ? cur + ' ' + w : w;
      if(test.length > maxChars && cur){ lines.push(cur); cur = w; }
      else cur = test;
    });
    if(cur) lines.push(cur);
    if(lines.length <= 1) return;

    const x = textEl.getAttribute('x') || 0;
    const fontSize = parseFloat(textEl.getAttribute('font-size')) || parseFloat(getComputedStyle(textEl).fontSize) || 14;
    textEl.textContent = '';
    lines.forEach((line, idx)=>{
      const tspan = document.createElementNS('http://www.w3.org/2000/svg','tspan');
      tspan.setAttribute('x', x);
      tspan.setAttribute('dy', idx === 0 ? -((lines.length-1) * fontSize * 0.6) : fontSize * 1.2);
      tspan.textContent = line;
      textEl.appendChild(tspan);
    });
  });
}

function ensureShadowFilter(svgEl){
  let defs = svgEl.querySelector('defs');
  if(!defs){ defs = document.createElementNS('http://www.w3.org/2000/svg','defs'); svgEl.insertBefore(defs, svgEl.firstChild); }
  if(!defs.querySelector('#mc-shadow')){
    const filter = document.createElementNS('http://www.w3.org/2000/svg','filter');
    filter.setAttribute('id','mc-shadow');
    filter.setAttribute('x','-30%'); filter.setAttribute('y','-30%');
    filter.setAttribute('width','160%'); filter.setAttribute('height','160%');
    filter.innerHTML = '<feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.28"/>';
    defs.appendChild(filter);
  }
}

function applyMulticolor(svgEl){
  ensureShadowFilter(svgEl);
  const groups = svgEl.querySelectorAll(
    '.node, .actor, .classGroup, .er.entityBox, .mindmap-node, .quadrantPoint, ' +
    '.requirementBox, .task, .timeline-node, .journey-section, .taskRect, ' +
    '[class*="person" i], [class*="system" i], [class*="container" i], [class*="component" i], ' +
    '[class*="boundary" i], [class*="bar" i], ' +
    '[class*="node" i], [class*="box" i], [class*="item" i], [class*="cell" i], ' +
    '[class*="circle" i], [class*="byte" i], [class*="field" i], ' +
    '[class*="leaf" i], [class*="branch" i], [class*="domain" i], ' +
    '[class*="event" i], [class*="command" i]'
  );
  const seen = new Set();
  let i = 0;
  groups.forEach(el=>{
    if(seen.has(el)) return;
    const tag = el.tagName.toLowerCase();
    const isShapeTag = tag === 'rect' || tag === 'polygon' || tag === 'circle' || tag === 'ellipse' || tag === 'path';
    const shape = isShapeTag ? el : el.querySelector('rect, polygon, circle, ellipse, path');
    if(!shape || seen.has(shape)) return;
    seen.add(el); seen.add(shape);
    const color = NODE_PALETTE[i % NODE_PALETTE.length];
    i++;
    shape.setAttribute('style', `fill:${color} !important; stroke:#1a1a1a !important; stroke-width:1.75px !important;`);
    if(shape.tagName.toLowerCase() === 'rect'){
      const h = parseFloat(shape.getAttribute('height')) || 0;
      const r = Math.min(cornerRadius, h/3 || cornerRadius);
      shape.setAttribute('rx', r);
      shape.setAttribute('ry', r);
    }
    el.setAttribute('filter', 'url(#mc-shadow)');
  });
}

    if(/(^|\n)\s*zenuml\b/.test(src) && window.ZENUML_LOAD){
      const ok = await window.ZENUML_LOAD;
      if(!ok) throw new Error('The ZenUML plugin could not be loaded from the CDN — check your network/firewall and reload.');
    }
    const id = 'mmd-' + Date.now();
    const { svg } = await mermaid.render(id, src);
    if(seq !== renderSeq) return; // stale
    holder.innerHTML = svg;
    holder.className = diagramTheme === 'dark' ? 'theme-dark' : '';
    const svgEl = holder.querySelector('svg');
    if(svgEl) wrapPlainSvgText(svgEl);
    if(svgEl && document.getElementById('multicolorToggle').checked){
      applyMulticolor(svgEl);
    }
    if(svgEl && document.getElementById('watermarkToggle').checked) addCopyrightMark(svgEl);
    currentSvgString = svgEl ? new XMLSerializer().serializeToString(svgEl) : svg;
    errBox.classList.remove('show');
    setStatus(true, 'Rendered');
    renderTimeEl.textContent = (performance.now()-t0).toFixed(0) + 'ms';
    resetView();
  }catch(err){
    if(seq !== renderSeq) return;
    errBox.textContent = (err && err.message) ? err.message : String(err);
    errBox.classList.add('show');
    setStatus(false, 'Syntax error');
  }
}

let debounceT;
codeEl.addEventListener('input', ()=>{
  clearTimeout(debounceT);
  debounceT = setTimeout(renderDiagram, 350);
});

// ---------- pan / zoom ----------
function applyTransform(){
  holder.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  zoomPct.textContent = Math.round(scale*100) + '%';
}
function resetView(){ scale=1; panX=0; panY=0; applyTransform(); }

document.getElementById('zoomIn').onclick = ()=>{ scale = Math.min(scale*1.2, 6); applyTransform(); };
document.getElementById('zoomOut').onclick = ()=>{ scale = Math.max(scale/1.2, 0.15); applyTransform(); };
document.getElementById('zoomFit').onclick = resetView;

const wrap = document.getElementById('canvas-wrap');
wrap.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.92 : 1.08;
  scale = Math.min(Math.max(scale*delta, 0.15), 6);
  applyTransform();
}, { passive:false });

stage.addEventListener('mousedown', (e)=>{
  isPanning = true; stage.classList.add('grabbing');
  startX = e.clientX - panX; startY = e.clientY - panY;
});
window.addEventListener('mousemove', (e)=>{
  if(!isPanning) return;
  panX = e.clientX - startX; panY = e.clientY - startY;
  applyTransform();
});
window.addEventListener('mouseup', ()=>{ isPanning=false; stage.classList.remove('grabbing'); });

// ---------- theme ----------
document.getElementById('themeToggle').onclick = ()=>{
  const body = document.body;
  const next = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  body.setAttribute('data-theme', next);
};

document.getElementById('diagramTheme').addEventListener('change', (e)=>{
  diagramTheme = e.target.value;
  initMermaid(diagramTheme);
  renderDiagram();
});

document.getElementById('multicolorToggle').addEventListener('change', renderDiagram);
document.getElementById('watermarkToggle').addEventListener('change', renderDiagram);
document.getElementById('transparentToggle').addEventListener('change', ()=>{}); // read at export time, no re-render needed

document.getElementById('wrapWidthInput').addEventListener('change', (e)=>{
  const v = parseInt(e.target.value, 10);
  wrapChars = isNaN(v) ? 33 : Math.min(Math.max(v, 8), 120);
  e.target.value = wrapChars;
  initMermaid(diagramTheme);
  renderDiagram();
});

document.getElementById('fontSizeInput').addEventListener('change', (e)=>{
  const v = parseInt(e.target.value, 10);
  baseFontSize = isNaN(v) ? 16 : Math.min(Math.max(v, 8), 40);
  e.target.value = baseFontSize;
  initMermaid(diagramTheme);
  renderDiagram();
});

document.getElementById('curveStyle').addEventListener('change', (e)=>{
  edgeCurve = e.target.value;
  initMermaid(diagramTheme);
  renderDiagram();
});

document.getElementById('cornerRadiusInput').addEventListener('change', (e)=>{
  const v = parseInt(e.target.value, 10);
  cornerRadius = isNaN(v) ? 14 : Math.min(Math.max(v, 0), 40);
  e.target.value = cornerRadius;
  renderDiagram();
});

// ---------- samples ----------
document.getElementById('samples').addEventListener('change', (e)=>{
  const key = e.target.value;
  if(!key) return;
  codeEl.value = SAMPLES[key];
  renderDiagram();
  e.target.value = '';
});

// ---------- toast ----------
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---------- menus ----------
function wireMenu(btnId, menuId){
  const btn = document.getElementById(btnId), menu = document.getElementById(menuId);
  btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    document.querySelectorAll('.menu.open').forEach(m=> m!==menu && m.classList.remove('open'));
    menu.classList.toggle('open');
  });
}
wireMenu('copyBtn','copyMenu');
wireMenu('downloadBtn','downloadMenu');
window.addEventListener('click', ()=> document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open')));

// ---------- svg -> canvas helper ----------
function svgToCanvas(scaleFactor=3, forceOpaque=false){
  return new Promise((resolve, reject)=>{
    if(!currentSvgString) return reject('No diagram rendered yet.');
    const svgEl = holder.querySelector('svg');
    if(!svgEl) return reject('No diagram rendered yet.');
    const clone = svgEl.cloneNode(true);
    if(!clone.getAttribute('xmlns')) clone.setAttribute('xmlns','http://www.w3.org/2000/svg');

    const bbox = svgEl.getBBox ? svgEl.getBBox() : null;
    let w = svgEl.viewBox && svgEl.viewBox.baseVal && svgEl.viewBox.baseVal.width ? svgEl.viewBox.baseVal.width : (bbox ? bbox.width : svgEl.clientWidth || 800);
    let h = svgEl.viewBox && svgEl.viewBox.baseVal && svgEl.viewBox.baseVal.height ? svgEl.viewBox.baseVal.height : (bbox ? bbox.height : svgEl.clientHeight || 600);
    clone.setAttribute('width', w);
    clone.setAttribute('height', h);

    // embed background so the export isn't transparent — matched to the diagram's own color
    // theme, not the page chrome. Skipped when the person wants a transparent PNG (JPEG has no
    // alpha channel, so forceOpaque overrides that for jpeg exports regardless of the toggle).
    const wantTransparent = document.getElementById('transparentToggle').checked && !forceOpaque;
    const bg = THEME_BG[diagramTheme] || '#ffffff';

    // Ensure every element in the clone is namespaced correctly and any <img>/foreignObject
    // content stays inline (mermaid already inlines its own <style>, no external refs).
    let svgStr = new XMLSerializer().serializeToString(clone);
    if(!svgStr.match(/^<svg[^>]+xmlns:xlink=/)) {
      svgStr = svgStr.replace('<svg', '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
    }

    // Using a base64 data: URI (rather than a blob: URL) avoids the canvas being
    // flagged as tainted in Chrome/Firefox when the SVG contains <foreignObject> HTML labels.
    const utf8Bytes = new TextEncoder().encode(svgStr);
    let binary = '';
    utf8Bytes.forEach(b => binary += String.fromCharCode(b));
    const b64 = btoa(binary);
    const dataUri = 'data:image/svg+xml;base64,' + b64;

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>{
      try{
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.ceil(w*scaleFactor));
        canvas.height = Math.max(1, Math.ceil(h*scaleFactor));
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        if(!wantTransparent){
          ctx.fillStyle = bg;
          ctx.fillRect(0,0,canvas.width, canvas.height);
        }
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas);
      }catch(err){
        reject('Rasterize failed: ' + (err && err.message ? err.message : err));
      }
    };
    img.onerror = ()=>{ reject('Could not load the diagram as an image for export.'); };
    img.src = dataUri;
  });
}

function downloadBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

// ---------- copy actions ----------
document.querySelectorAll('#copyMenu [data-copy]').forEach(btn=>{
  btn.addEventListener('click', async ()=>{
    document.getElementById('copyMenu').classList.remove('open');
    const kind = btn.dataset.copy;
    try{
      if(kind === 'code'){
        await navigator.clipboard.writeText(codeEl.value);
        toast('Mermaid code copied');
      } else if(kind === 'svg'){
        if(!currentSvgString) throw 'No diagram rendered yet.';
        await navigator.clipboard.writeText(currentSvgString);
        toast('SVG markup copied');
      } else if(kind === 'png' || kind === 'jpeg'){
        const canvas = await svgToCanvas(exportScale, kind === 'jpeg');
        const mime = kind === 'jpeg' ? 'image/jpeg' : 'image/png';
        canvas.toBlob(async (blob)=>{
          if(!blob){ toast('Could not generate image data'); return; }
          try{
            await navigator.clipboard.write([ new ClipboardItem({ [mime]: blob }) ]);
            toast((kind === 'jpeg' ? 'JPEG' : 'PNG') + ' copied to clipboard');
          }catch(e){
            toast('Clipboard needs HTTPS / a user gesture — try Download instead');
          }
        }, mime, kind === 'jpeg' ? 0.95 : undefined);
      }
    }catch(e){
      toast(typeof e === 'string' ? e : (e && e.message ? e.message : 'Copy failed'));
    }
  });
});

// ---------- download actions ----------
document.querySelectorAll('#downloadMenu [data-dl]').forEach(btn=>{
  btn.addEventListener('click', async ()=>{
    document.getElementById('downloadMenu').classList.remove('open');
    const kind = btn.dataset.dl;
    try{
      if(kind === 'svg'){
        if(!currentSvgString) throw 'No diagram rendered yet.';
        downloadBlob(new Blob([currentSvgString], {type:'image/svg+xml'}), 'diagram.svg');
        toast('SVG downloaded');
      } else if(kind === 'png' || kind === 'jpeg'){
        const canvas = await svgToCanvas(exportScale, kind === 'jpeg');
        const mime = kind === 'jpeg' ? 'image/jpeg' : 'image/png';
        canvas.toBlob((blob)=>{
          if(!blob){ toast('Could not generate image data'); return; }
          downloadBlob(blob, kind === 'jpeg' ? 'diagram.jpg' : 'diagram.png');
          toast((kind === 'jpeg' ? 'JPEG' : 'PNG') + ' downloaded');
        }, mime, kind === 'jpeg' ? 0.95 : undefined);
      } else if(kind === 'pdf'){
        if(!window.jspdf){ throw 'PDF library failed to load (check your network/CDN access).'; }
        const canvas = await svgToCanvas(exportScale, true);
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const orientation = canvas.width >= canvas.height ? 'l' : 'p';
        const pdf = new jsPDF({ orientation, unit:'pt', format:[canvas.width/exportScale, canvas.height/exportScale] });
        pdf.addImage(imgData, 'PNG', 0, 0, canvas.width/exportScale, canvas.height/exportScale);
        pdf.save('diagram.pdf');
        toast('PDF downloaded');
      }
    }catch(e){
      toast(typeof e === 'string' ? e : (e && e.message ? e.message : 'Export failed'));
    }
  });
});

// ---------- init ----------
codeEl.value = SAMPLES.flow;
renderDiagram();

// ---------- resizable split ----------
const dragHandle = document.getElementById('drag');
const editorPane = document.getElementById('editor-pane');
let dragging = false;
dragHandle.addEventListener('mousedown', ()=>{ dragging = true; document.body.style.userSelect='none'; });
window.addEventListener('mouseup', ()=>{ dragging=false; document.body.style.userSelect=''; });
window.addEventListener('mousemove', (e)=>{
  if(!dragging) return;
  const mainRect = document.querySelector('main').getBoundingClientRect();
  let pct = ((e.clientX - mainRect.left) / mainRect.width) * 100;
  pct = Math.min(Math.max(pct, 20), 75);
  editorPane.style.width = pct + '%';
});

})(); // end async IIFE
</script>
